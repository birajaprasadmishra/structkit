[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "structkit"
version = "0.0.1"
description = "Structural analysis of beams, plane trusses and plane frames by the direct stiffness method"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Biraja Prasad Mishra" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
